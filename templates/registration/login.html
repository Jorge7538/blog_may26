{% load static %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'login.css' %}">
{% endblock %}

{% block content %}
  <div class="login-container">
    <h2>Iniciar Sesión</h2>
    
    {% if form.errors %}
      <div class="error-msg">Usuario o contraseña incorrectos. Por favor, intenta de nuevo.</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-submit">Entrar</button>
    </form>
  </div>
{% endblock %}
